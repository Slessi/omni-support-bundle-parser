name: Docker build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: omni-support-bundle-parser:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name app -p 8080:8080 omni-support-bundle-parser:ci
          for i in $(seq 1 10); do curl -fsS http://localhost:8080/ >/dev/null && break; sleep 1; done
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          asset=$(curl -fsS http://localhost:8080/ | grep -o 'assets/[^"]*\.js' | head -1)
          curl -fsSI "http://localhost:8080/${asset}" | grep -qi 'cache-control: public, max-age=31536000, immutable'
          curl -fsSI http://localhost:8080/ | grep -qi 'cache-control: no-cache'
          curl -fsS -H 'Accept-Encoding: gzip' -o /dev/null -D - "http://localhost:8080/${asset}" | grep -qi 'content-encoding: gzip'
          docker rm -f app
